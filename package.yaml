name: inventory-app
version: 0.1.0.0
github: "wolfadex/inventory-app"
license: BSD-3-Clause
author: "Wolfgang Schuster"
maintainer: "wolfadex@gmail.com"
copyright: "Wolfgang Schuster"

extra-source-files:
  - README.md
  - CHANGELOG.md

# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            Web

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description: Please see the README on GitHub at <https://github.com/wolfadex/inventory-app#readme>

dependencies:
  - aeson
  - array
  - base >= 4.7 && < 5
  - base-compat
  - bytestring
  - containers
  - cookie
  - directory
  - ghc-prim
  - http-conduit
  - http-types
  - mtl
  - scotty
  - servant
  - servant-server >= 0.20 && < 0.21
  - text
  - time
  - wai
  - warp

ghc-options:
  - -Wall
  - -Wcompat
  - -Widentities
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wmissing-export-lists
  - -Wmissing-home-modules
  - -Wpartial-fields
  - -Wredundant-constraints

library:
  source-dirs:
    - src
    - gen

executables:
  inventory-app-exe:
    main: Main.hs
    source-dirs: app
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - inventory-app

tests:
  inventory-app-test:
    main: Spec.hs
    source-dirs: test
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - inventory-app
